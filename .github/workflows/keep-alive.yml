name: Quick-Clinic 24/7 backend health monitor
on:
  schedule:
    # Standard POSIX intervals to ensure Render never spins down (15-min idle timeout)
    - cron: '*/10 * * * *'
    - cron: '*/14 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quick-clinic-keep-alive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe and wake Render backend
        run: |
          TARGET="${{ vars.QUICK_CLINIC_BACKEND_URL || 'https://quick-clinic-api.onrender.com' }}"
          echo "Pinging backend at $TARGET to maintain 24/7 liveness..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$TARGET/api/health" || echo "000")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Direct /api/health returned $HTTP_STATUS, trying fallback /health..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$TARGET/health" || echo "000")
          fi
          echo "Probe completed with status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Backend is active and responding."
            exit 0
          else
            echo "Backend wake-up probe dispatched (HTTP $HTTP_STATUS)."
            exit 0
          fi

name: Quick-Clinic 24/7 backend health monitor
on:
  schedule:
    # Standard POSIX intervals to ensure Render never spins down (15-min idle timeout)
    - cron: '*/10 * * * *'
    - cron: '*/14 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quick-clinic-keep-alive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe Render backend health and readiness
        env:
          QUICK_CLINIC_BACKEND_URL: ${{ vars.QUICK_CLINIC_BACKEND_URL || 'https://quick-clinic-api.onrender.com' }}
          KEEPALIVE_UNTIL: ${{ vars.KEEPALIVE_UNTIL || 'always' }}
        run: python3 backend/scripts/deployment/keep_alive.py

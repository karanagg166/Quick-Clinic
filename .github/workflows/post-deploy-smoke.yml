name: Quick-Clinic Deployment Health
on:
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured frontend and unified backend
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          test -n "$APP_URL" && test -n "$BACKEND_URL"
          curl --fail --silent --show-error --max-time 30 "$APP_URL/api/health"
          curl --fail --silent --show-error --max-time 30 "$BACKEND_URL/api/ready"

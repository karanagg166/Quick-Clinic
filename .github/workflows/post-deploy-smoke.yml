name: Quick-Clinic Deployment Health
on:
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --locked --project backend
      - name: Read-only deployment smoke and access-control probes
        env:
          QC_LIVE_FRONTEND_URL: ${{ secrets.PRODUCTION_APP_URL }}
          QC_LIVE_BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: uv run --directory backend pytest tests/live --run-live --junitxml=/tmp/quick-clinic-live-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-smoke-results
          path: /tmp/quick-clinic-live-tests.xml

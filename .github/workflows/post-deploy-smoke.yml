name: Quick-Clinic Post-Deployment Live Smoke

# Dispatch after Vercel deployment succeeds; CI completion can precede deployment.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main revision already deployed to the web API
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: quick-clinic-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    name: Deployment contracts (authenticated Search Sphere journey is separate)
    if: github.ref == 'refs/heads/main'
    environment: search-sphere-release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate main deployment revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          sha = os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Full lowercase SHA required'
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Safe Production Smoke Suite
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PROD_WEB_URL: "https://quick-clinic-nine.vercel.app"
          PROD_SOCKET_URL: "https://quickclinic-socket-server.onrender.com"
          SMOKE_TIMEOUT_MS: "30000"
        run: pnpm exec tsx scripts/production-smoke-test.ts

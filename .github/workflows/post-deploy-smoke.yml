name: Quick-Clinic Post-Deployment Live Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-clinic-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Real Vercel + Render + Database API Contracts
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Safe Production Smoke Suite
        env:
          PROD_WEB_URL: "https://quick-clinic-nine.vercel.app"
          PROD_SOCKET_URL: "https://quickclinic-socket-server.onrender.com"
          SMOKE_TIMEOUT_MS: "30000"
        run: pnpm exec tsx scripts/production-smoke-test.ts

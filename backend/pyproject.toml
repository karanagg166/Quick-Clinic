[project]
name = "quick-clinic-backend"
version = "1.0.0"
description = "Unified Quick-Clinic API and Socket.IO backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.38,<1",
  "sqlalchemy[asyncio]>=2.0.44,<2.1",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.11,<3",
  "python-socketio>=5.14,<6",
  "redis>=6.4,<8",
  "PyJWT>=2.10,<3",
  "bcrypt>=4.3,<6",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.3,<3",
  "pillow>=12,<13",
  "pypdf>=6,<7",
  "cloudinary>=1.44,<2",
]
[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "aiosqlite>=0.21,<1", "ruff>=0.14,<1", "aiohttp>=3.13,<4"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project]
name = "quick-clinic-backend"
version = "1.0.0"
description = "Unified Quick-Clinic API and Socket.IO backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.38,<1",
  "sqlalchemy[asyncio]>=2.0.44,<2.1",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.11,<3",
  "python-socketio>=5.14,<6",
  "redis>=6.4,<8",
  "PyJWT>=2.10,<3",
  "bcrypt>=4.3,<6",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.3,<3",
  "pillow>=12,<13",
  "pypdf>=6,<7",
  "langchain>=1.4.10",
  "langgraph>=1.2.20",
  "langgraph-checkpoint-postgres>=3.2.0",
  "langchain-google-genai>=4.4.3",
  "langchain-groq>=1.1.3",
  "langchain-cohere>=0.6.0",
  "langsmith>=0.14.17",
  "alembic>=1.14,<2",
]
[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "aiosqlite>=0.21,<1",
    "ruff>=0.14,<1",
    "aiohttp>=3.13,<4",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "hypothesis>=6.140,<7",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
timeout = 60
markers = [
  "unit: pure logic and mocked boundary tests",
  "feature: real HTTP adapters against an isolated database",
  "integration: transactions, providers and realtime integration",
  "postgres: requires an explicitly configured disposable PostgreSQL database",
  "security: authentication, authorization, privacy and abuse resistance",
  "performance: bounded local performance and resource budgets",
  "smoke: critical service startup and contract probes",
  "live: opt-in read-only checks of an explicitly configured deployment",
  "contract: retained route and provider contracts",
]
[tool.coverage.run]
branch = true
concurrency = ["thread", "greenlet"]
core = "ctrace"
source = ["app"]
[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
[tool.coverage.xml]
output = "/tmp/quick-clinic-coverage.xml"
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

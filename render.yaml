# Free-only deployment. Database and object storage use the dedicated Quick-Clinic Supabase project.
services:
  - type: web
    name: quick-clinic-api
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: false
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DOCUMENT_STORAGE_BACKEND
        value: supabase
      - key: FRONTEND_URL
        value: https://quick-clinic-nine.vercel.app
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://yrrcjcddrmkercetjfhl.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_DOCUMENT_BUCKET
        value: quick-clinic-medical-documents
      - key: SUPABASE_AVATAR_BUCKET
        value: quick-clinic-avatars
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev

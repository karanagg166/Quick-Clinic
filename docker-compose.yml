services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    env_file: .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - medical-documents:/app/data/medical-documents
    environment:
      DOCUMENT_STORAGE_DIR: /app/data/medical-documents
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:4000}
volumes:
  medical-documents:
